<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="900" height="320" rx="16" fill="url(#bg)"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="18" font-weight="700">Backend Performance Stack</text>

  <!-- GZip -->
  <g filter="url(#shadow)">
    <rect x="20" y="60" width="170" height="100" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="105" y="88" text-anchor="middle" fill="#3b82f6" font-family="system-ui" font-size="13" font-weight="700">GZip Compression</text>
    <text x="105" y="108" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">Responses &gt;500 bytes</text>
    <text x="105" y="128" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="20" font-weight="700">~70%</text>
    <text x="105" y="146" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">smaller payloads</text>
  </g>

  <!-- Cache-Control -->
  <g filter="url(#shadow)">
    <rect x="200" y="60" width="170" height="100" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="285" y="88" text-anchor="middle" fill="#8b5cf6" font-family="system-ui" font-size="13" font-weight="700">Cache-Control</text>
    <text x="285" y="108" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">Per-endpoint headers</text>
    <text x="285" y="128" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="20" font-weight="700">30–300s</text>
    <text x="285" y="146" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">stale-while-revalidate</text>
  </g>

  <!-- TTL Cache -->
  <g filter="url(#shadow)">
    <rect x="380" y="60" width="170" height="100" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="465" y="88" text-anchor="middle" fill="#f59e0b" font-family="system-ui" font-size="13" font-weight="700">In-Memory Cache</text>
    <text x="465" y="108" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">TTL-based, async-safe</text>
    <text x="465" y="128" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="20" font-weight="700">60s TTL</text>
    <text x="465" y="146" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">/summary endpoint</text>
  </g>

  <!-- Request Logging -->
  <g filter="url(#shadow)">
    <rect x="560" y="60" width="170" height="100" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <text x="645" y="88" text-anchor="middle" fill="#06b6d4" font-family="system-ui" font-size="13" font-weight="700">Request Logging</text>
    <text x="645" y="108" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">Structured, per-request</text>
    <text x="645" y="128" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="11">X-Request-ID</text>
    <text x="645" y="146" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="11">X-Response-Time</text>
  </g>

  <!-- Health Check -->
  <g filter="url(#shadow)">
    <rect x="740" y="60" width="140" height="100" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
    <text x="810" y="88" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="13" font-weight="700">/health</text>
    <text x="810" y="108" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">Pool stats</text>
    <text x="810" y="122" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">DB latency</text>
    <text x="810" y="136" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">Uptime + Cache</text>
    <text x="810" y="150" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">Version</text>
  </g>

  <!-- DB Pool -->
  <g filter="url(#shadow)">
    <rect x="20" y="180" width="260" height="120" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <text x="150" y="208" text-anchor="middle" fill="#ef4444" font-family="system-ui" font-size="13" font-weight="700">Connection Pool Tuning</text>
    <text x="150" y="232" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="11">pool_size=20  max_overflow=10</text>
    <text x="150" y="252" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="11">pool_recycle=1800  pre_ping=True</text>
    <text x="150" y="272" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="11">statement_timeout=30s</text>
    <text x="150" y="292" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="11">lock_timeout=10s</text>
  </g>

  <!-- Indexes -->
  <g filter="url(#shadow)">
    <rect x="300" y="180" width="300" height="120" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="450" y="208" text-anchor="middle" fill="#f59e0b" font-family="system-ui" font-size="13" font-weight="700">20+ Database Indexes</text>
    <text x="450" y="232" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">GIST spatial: stations, anomalies, tiles</text>
    <text x="450" y="252" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">Composite: (station_id, obs_date), (type, severity)</text>
    <text x="450" y="272" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">Covering: forecasts, monthly_summary</text>
    <text x="450" y="292" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">Partial: model_registry (WHERE is_active)</text>
  </g>

  <!-- CORS + Pydantic -->
  <g filter="url(#shadow)">
    <rect x="620" y="180" width="260" height="120" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="750" y="208" text-anchor="middle" fill="#8b5cf6" font-family="system-ui" font-size="13" font-weight="700">Security &amp; Compliance</text>
    <text x="750" y="232" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">CORS: explicit methods/headers</text>
    <text x="750" y="252" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">Pydantic v2: SettingsConfigDict</text>
    <text x="750" y="272" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">regex → pattern migration</text>
    <text x="750" y="292" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">extra="ignore" validation</text>
  </g>
</svg>
