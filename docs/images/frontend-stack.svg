<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="900" height="320" rx="16" fill="url(#bg)"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="18" font-weight="700">Frontend Production UI Stack</text>

  <!-- Error Boundary -->
  <g filter="url(#shadow)">
    <rect x="20" y="60" width="170" height="100" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <text x="105" y="88" text-anchor="middle" fill="#ef4444" font-family="system-ui" font-size="13" font-weight="700">Error Boundary</text>
    <text x="105" y="108" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">Crash recovery UI</text>
    <text x="105" y="128" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">"Try Again" screen</text>
    <text x="105" y="146" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">No more blank pages</text>
  </g>

  <!-- Toast -->
  <g filter="url(#shadow)">
    <rect x="200" y="60" width="170" height="100" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="285" y="88" text-anchor="middle" fill="#f59e0b" font-family="system-ui" font-size="13" font-weight="700">Toast System</text>
    <text x="285" y="108" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">4 types: success, error,</text>
    <text x="285" y="124" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">warning, info</text>
    <text x="285" y="146" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">Auto-dismiss 5s</text>
  </g>

  <!-- API Retry -->
  <g filter="url(#shadow)">
    <rect x="380" y="60" width="170" height="100" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="465" y="88" text-anchor="middle" fill="#3b82f6" font-family="system-ui" font-size="13" font-weight="700">API Retry</text>
    <text x="465" y="108" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">Exponential backoff</text>
    <text x="465" y="128" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="12">0 → 1s → 3s</text>
    <text x="465" y="146" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">5xx + 429 retryable</text>
  </g>

  <!-- Skeletons -->
  <g filter="url(#shadow)">
    <rect x="560" y="60" width="170" height="100" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
    <text x="645" y="88" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="13" font-weight="700">Loading Skeletons</text>
    <text x="645" y="108" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">Shimmer placeholders</text>
    <text x="645" y="128" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">Map · Panel · Dashboard</text>
    <text x="645" y="146" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">animate-pulse</text>
  </g>

  <!-- Build -->
  <g filter="url(#shadow)">
    <rect x="740" y="60" width="140" height="100" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="810" y="88" text-anchor="middle" fill="#8b5cf6" font-family="system-ui" font-size="13" font-weight="700">Vite Build</text>
    <text x="810" y="108" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">4 vendor chunks</text>
    <text x="810" y="122" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">ES2020 target</text>
    <text x="810" y="136" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">Sourcemaps</text>
    <text x="810" y="150" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">Long-term caching</text>
  </g>

  <!-- Sidebar -->
  <g filter="url(#shadow)">
    <rect x="20" y="180" width="210" height="120" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <text x="125" y="208" text-anchor="middle" fill="#06b6d4" font-family="system-ui" font-size="13" font-weight="700">Responsive Sidebar</text>
    <text x="125" y="232" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">200ms slide animation</text>
    <text x="125" y="252" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">Mobile: 85vw + overlay</text>
    <text x="125" y="272" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">Desktop: 400px fixed</text>
    <text x="125" y="292" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="10">overscroll-contain</text>
  </g>

  <!-- Accessibility -->
  <g filter="url(#shadow)">
    <rect x="250" y="180" width="210" height="120" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
    <text x="355" y="208" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="13" font-weight="700">Accessibility (A11y)</text>
    <text x="355" y="232" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">ARIA roles &amp; labels</text>
    <text x="355" y="252" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">aria-pressed toggles</text>
    <text x="355" y="272" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">:focus-visible rings</text>
    <text x="355" y="292" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">aria-live regions</text>
  </g>

  <!-- Meta + SEO -->
  <g filter="url(#shadow)">
    <rect x="480" y="180" width="190" height="120" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="575" y="208" text-anchor="middle" fill="#f59e0b" font-family="system-ui" font-size="13" font-weight="700">Meta &amp; SEO</text>
    <text x="575" y="232" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">Open Graph tags</text>
    <text x="575" y="252" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">theme-color meta</text>
    <text x="575" y="272" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">CDN preconnect</text>
    <text x="575" y="292" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">Custom SVG favicon</text>
  </g>

  <!-- Memoization -->
  <g filter="url(#shadow)">
    <rect x="690" y="180" width="190" height="120" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="785" y="208" text-anchor="middle" fill="#3b82f6" font-family="system-ui" font-size="13" font-weight="700">Performance</text>
    <text x="785" y="232" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">useMemo on chart data</text>
    <text x="785" y="252" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">useDebounce on filters</text>
    <text x="785" y="272" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">AbortController cleanup</text>
    <text x="785" y="292" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="11">requestAnimationFrame</text>
  </g>
</svg>
